<!DOCTYPE html>
<html>
<head>
    <title>Flash Message Test</title>
    <style>
        .alert {
            position: relative;
            padding: 16px 40px 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            transition: opacity 0.3s ease;
        }
        
        .alert-close {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
            padding: 0;
            width: 24px;
            height: 24px;
        }
        
        .alert-close:hover {
            opacity: 1;
        }
        
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }
        
        .alert-success .alert-close {
            color: #065f46;
        }
    </style>
</head>
<body>
    <h1>Flash Message Auto-Dismiss Test</h1>
    
    <div class="alert alert-success" id="successAlert">
        Test success message - should disappear in 5 seconds
        <button onclick="this.parentElement.remove()" class="alert-close">&times;</button>
    </div>
    
    <div id="console-output"></div>
    
    <script>
        console.log('Test page loaded');
        
        // Auto-dismiss flash messages after 5 seconds
        setTimeout(function() {
            console.log('5 seconds passed, attempting to dismiss...');
            const successAlert = document.getElementById('successAlert');
            
            if (successAlert) {
                console.log('Found success alert, fading out...');
                successAlert.style.opacity = '0';
                setTimeout(() => {
                    console.log('Removing alert...');
                    successAlert.remove();
                    document.getElementById('console-output').innerHTML = '<p style="color: green;">✓ Auto-dismiss worked!</p>';
                }, 300);
            } else {
                console.log('Alert not found!');
                document.getElementById('console-output').innerHTML = '<p style="color: red;">✗ Alert element not found!</p>';
            }
        }, 5000);
        
        // Log every second
        let count = 5;
        const interval = setInterval(() => {
            console.log(`${count} seconds remaining...`);
            count--;
            if (count < 0) clearInterval(interval);
        }, 1000);
    </script>
</body>
</html>
